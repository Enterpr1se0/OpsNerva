listen_address: 127.0.0.1:8080
data_dir: data
database_path: data/opsnerva.db

# Optional Web control-plane login. Authentication and encrypted credential
# migration are enabled only when password is non-empty. Environment overrides:
# OPSNERVA_AUTH_USERNAME, OPSNERVA_AUTH_PASSWORD,
# OPSNERVA_AUTH_SESSION_TTL_HOURS.
auth:
  username: admin
  password: ""
  session_ttl_hours: 24

# OpsNerva creates one directory per Workspace below this managed root.
# Relative paths use the configuration file directory. Override with
# OPSNERVA_WORKSPACE_DIR.
workspace_dir: workspace

# System settings choose Sandbox, Host Shell, or Disabled. Sandbox is the
# fail-safe default and requires this Bubblewrap binary on Linux; it never
# falls back to Host Shell. Override with OPSNERVA_WORKSPACE_SANDBOX.
workspace_sandbox_path: bwrap

# Validators are argv templates, never shell snippets. {{path}} is substituted
# as one quoted remote argument or one local exec.Command argument.
validators:
  - id: nginx
    scope: remote
    program: nginx
    args: ["-t", "-c", "{{path}}"]
    timeout_seconds: 15
    path_patterns: ["/etc/nginx/**"]

logging:
  level: debug # use info in production when detailed lifecycle logs are not needed
  format: text # terminal format: text or json; the rotating file is always JSONL
  file: data/opsnerva.log # set to "-" to disable file output
  add_source: false
  max_size_mb: 20
  max_backups: 3
  recent_limit: 2000 # in-memory entries available to the Web Logs page

ssh:
  default_known_hosts: data/known_hosts

model:
  base_url: ""
  name: gpt-4o-mini

limits:
  sync_timeout_seconds: 60
  max_timeout_seconds: 600
  global_concurrency: 8
  host_concurrency: 2
