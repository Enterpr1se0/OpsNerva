name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            run_tests: true
            artifact: opsnerva-linux-x64
            paths: |
              web/src-tauri/target/release/bundle/appimage/*.AppImage
              web/src-tauri/target/release/bundle/deb/*.deb
          - name: Linux ARM64
            os: ubuntu-22.04
            run_tests: false
            target: aarch64-unknown-linux-gnu
            artifact: opsnerva-linux-arm64
            paths: |
              web/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              web/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
          - name: Windows x64
            os: windows-latest
            run_tests: false
            artifact: opsnerva-windows-x64
            paths: web/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      # TODO(arm): Windows ARM64 desktop packages are not built yet. They require a
      # native arm64 Windows runner (GitHub has no hosted one) or an ARM64 cross
      # toolchain setup, so they are intentionally left out of the matrix.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install Linux ARM64 cross-compilation toolchain
        if: runner.os == 'Linux' && matrix.target
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 libssl-dev:arm64 libgtk-3-dev:arm64 libglib2.0-dev:arm64 libsoup-3.0-dev:arm64

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web frontend
        run: npm run build
        working-directory: web

      - name: Test Go backend
        if: matrix.run_tests
        run: go test ./...

      - name: Compile Go backend for Windows
        if: ${{ !matrix.run_tests }}
        run: go test ./... -run '^$'

      - name: Build desktop package
        env:
          # Cross-compilation environment for the ARM64 target.
          CC: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          PKG_CONFIG: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-pkg-config' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: npm run desktop:build ${{ matrix.target && format('-- --target {0}', matrix.target) }}
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: opsnerva-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
