[package]
name = "opsnerva-desktop"
version = "0.1.7"
description = "OpsNerva desktop application"
authors = ["OpsNerva contributors"]
edition = "2024"

[lib]
name = "opsnerva_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
